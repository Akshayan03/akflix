name: Build standalone Windows

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: standalone-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    # Akflix accounts: the project's public web config (repository variables,
    # not secrets; the values ship inside the app).
    env:
      VITE_AKFLIX_FIREBASE_API_KEY: ${{ vars.VITE_AKFLIX_FIREBASE_API_KEY }}
      VITE_AKFLIX_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_AKFLIX_FIREBASE_AUTH_DOMAIN }}
      VITE_AKFLIX_FIREBASE_PROJECT_ID: ${{ vars.VITE_AKFLIX_FIREBASE_PROJECT_ID }}
      VITE_AKFLIX_FIREBASE_APP_ID: ${{ vars.VITE_AKFLIX_FIREBASE_APP_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            engine

      - uses: actions/cache/restore@v4
        id: ffmpeg-cache
        with:
          path: src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          key: ffmpeg-windows-lgpl-8.1.2-static-d3d11-v2

      - uses: msys2/setup-msys2@v2
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          update: true
          install: >-
            curl
            diffutils
            make
            tar
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config

      - run: npm ci

      # rqbit 9.0.1 with Akflix's librqbit fixes (engine/README.md), built from this repository.
      - name: Build the torrent engine
        shell: bash
        run: sh engine/build.sh x86_64-pc-windows-msvc

      - name: Build the LGPL FFmpeg sidecar
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz" -o ffmpeg.tar.xz
          echo "464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c  ffmpeg.tar.xz" | sha256sum --check
          tar -xf ffmpeg.tar.xz
          cd ffmpeg-8.1.2
          ./configure \
            --disable-doc --disable-debug --disable-ffplay --disable-ffprobe \
            --disable-avdevice --disable-autodetect --disable-shared --enable-static \
            --enable-mediafoundation --enable-d3d11va --enable-schannel --disable-x86asm \
            --extra-ldflags=-static
          make -j$(nproc) ffmpeg.exe
          cp ffmpeg.exe ../src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe

      - name: Verify bundled engines
        shell: pwsh
        run: |
          $rqbit = "src-tauri/binaries/rqbit-x86_64-pc-windows-msvc.exe"
          $ffmpeg = "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"
          if (!(Test-Path $rqbit) -or !(Test-Path $ffmpeg)) { throw "A Windows sidecar is missing" }
          & $ffmpeg -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg cannot run outside MSYS2" }
          & $rqbit --version
          if ($LASTEXITCODE -ne 0) { throw "rqbit cannot run" }
          $encoders = (& $ffmpeg -hide_banner -encoders 2>&1 | Out-String)
          if ($encoders -notmatch "h264_mf") { throw "FFmpeg was built without Media Foundation H.264" }

      - uses: actions/cache/save@v4
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          path: src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          key: ffmpeg-windows-lgpl-8.1.2-static-d3d11-v2

      - name: Test frontend and Windows backend
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/prepare-caption-model.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows installers
        run: npx tauri build --config src-tauri/tauri.local.conf.json --bundles nsis,msi

      - name: Check the accounts config is built in
        shell: pwsh
        run: |
          if (!$env:VITE_AKFLIX_FIREBASE_PROJECT_ID) { throw "Accounts config variables are not set" }
          $hits = Select-String -Path dist/assets/*.js -SimpleMatch $env:VITE_AKFLIX_FIREBASE_PROJECT_ID -List
          if (!$hits) { throw "The frontend was built without the accounts config" }
          $hits | ForEach-Object { $_.Path }

      - name: Test installed Windows app
        shell: pwsh
        run: ./scripts/test-windows-install.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: akflix-windows-standalone
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish Windows installers to the matching desktop release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "Akflix $tag" --notes "Akflix 1.0.34: playback no longer freezes after a long pause, and a new player. Pausing for more than about half a minute could leave the picture frozen when you pressed play again on a Mac: Akflix stops converting while paused, and the system player stopped reading a stream that had not changed for a while. Now play after a longer pause starts the stream again at the same spot, usually in about a second, with Reconnecting shown only if it takes longer; a player that says it is playing but does not move is restarted the same way. Skip Intro and Skip Recap are a quiet outline whose light fill drains while the part plays. The Next Episode card shows the next episode's picture, title and a short summary, with the countdown ring on Next Episode and Watch Credits beside it, and the credits keep playing full size. The controls are new: the picture fills the window with soft shading for the title and controls, the timeline shows the time under the pointer and marks the intro, recap and credits, the controls are grouped with tooltips, Episodes lists what comes next with pictures, and Audio and subtitles are in one panel. Captions keep clear of the Skip button and the card. In a window, the window takes the shape of the picture so there are no black bands, and goes back to its size afterwards. Download and engine code is unchanged from 1.0.33."
            if ($LASTEXITCODE -ne 0) {
              gh release view $tag
              if ($LASTEXITCODE -ne 0) { throw "Could not create matching desktop release" }
            }
          }
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe) + @(Get-ChildItem src-tauri/target/release/bundle/msi/*.msi)
          if ($files.Count -ne 2) { throw "Expected both EXE and MSI installers" }
          $checksums = $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" }
          $checksums | Set-Content -Encoding utf8 "SHA256SUMS-windows.txt"
          gh release upload $tag @($files.FullName) SHA256SUMS-windows.txt
          if ($LASTEXITCODE -ne 0) { throw "Could not publish Windows installers" }
