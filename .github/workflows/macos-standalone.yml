name: Build standalone macOS update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-14
    # Akflix accounts: the project's public web config (repository variables,
    # not secrets; the values ship inside the app).
    env:
      VITE_AKFLIX_FIREBASE_API_KEY: ${{ vars.VITE_AKFLIX_FIREBASE_API_KEY }}
      VITE_AKFLIX_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_AKFLIX_FIREBASE_AUTH_DOMAIN }}
      VITE_AKFLIX_FIREBASE_PROJECT_ID: ${{ vars.VITE_AKFLIX_FIREBASE_PROJECT_ID }}
      VITE_AKFLIX_FIREBASE_APP_ID: ${{ vars.VITE_AKFLIX_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Reuse the verified standalone engines from v1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p src-tauri/binaries "$RUNNER_TEMP/akflix-old"
          gh release download v1.0.1 --pattern "Akflix_1.0.1_aarch64.dmg" --dir "$RUNNER_TEMP"
          hdiutil attach "$RUNNER_TEMP/Akflix_1.0.1_aarch64.dmg" \
            -nobrowse -readonly -mountpoint "$RUNNER_TEMP/akflix-old"
          cp "$RUNNER_TEMP/akflix-old/Akflix.app/Contents/MacOS/rqbit" \
            src-tauri/binaries/rqbit-aarch64-apple-darwin
          cp "$RUNNER_TEMP/akflix-old/Akflix.app/Contents/MacOS/ffmpeg" \
            src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          hdiutil detach "$RUNNER_TEMP/akflix-old"
          chmod +x src-tauri/binaries/*-aarch64-apple-darwin
          file src-tauri/binaries/*-aarch64-apple-darwin

      - name: Download the bundled captions model
        run: |
          mkdir -p src-tauri/models
          curl --fail --location --retry 3 \
            --output src-tauri/models/ggml-base.en-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en-q5_1.bin
          echo "4baf70dd0d7c4247ba2b81fafd9c01005ac77c2f9ef064e00dcf195d0e2fdd2f  src-tauri/models/ggml-base.en-q5_1.bin" \
            | shasum -a 256 --check

      - name: Validate frontend and Rust backend
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Build Apple Silicon app and DMG
        run: >-
          npx tauri build
          --config src-tauri/tauri.local.conf.json
          --target aarch64-apple-darwin
          --bundles app,dmg

      - name: Check the accounts config is built in
        run: |
          test -n "$VITE_AKFLIX_FIREBASE_PROJECT_ID" || { echo "Accounts config variables are not set"; exit 1; }
          grep -lF "$VITE_AKFLIX_FIREBASE_PROJECT_ID" dist/assets/*.js \
            || { echo "The frontend was built without the accounts config"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Akflix-${{ steps.version.outputs.version }}-macOS
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Akflix_${{ steps.version.outputs.version }}_aarch64.dmg
          if-no-files-found: error

      - name: Publish Mac-only update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          DMG="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Akflix_${VERSION}_aarch64.dmg"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG"
          else
            gh release create "$TAG" "$DMG" \
              --target "$GITHUB_SHA" \
              --title "Akflix $TAG" \
              --notes "Akflix 1.0.30 fixes shows and movies that kept loading and never played, and makes Home lighter. Pressing Play could leave a black loading screen forever: the player opened before any video had arrived, a source that nobody was sharing was never replaced, and sources were tried in the provider's order, so a release with one seeder or in another language could go first. Now each source has to deliver its file list, a connected peer and the first bytes of the video in time; if it does not, Akflix moves on to the next source by itself, and after the last one, or two minutes in total, it says what went wrong instead of loading forever. When a source stays silent for 8 seconds, the next one is started beside it and Akflix switches to whichever sends video first. The player opens once video is arriving, a source that shows no picture within 45 seconds (75 seconds while converting) is replaced too, and the stream card shows the step and which source it is trying. Sources are tried in the order they can start: people sharing, size and resolution, with MP4 files the player shows at once before files that have to be converted. Releases marked French, German and other languages, or with a foreign flag in the source list, are no longer picked first for English audio. Home no longer asks the playback engine for its list every 2 seconds when nothing is playing, and catalogues saved the day before show at once while fresh ones download. Checked on a Mac with real sources and the app's own start code for Oppenheimer, Dune Part Two, Breaking Bad, The Office, Friends and Gilmore Girls: in the last side-by-side run every title played, 8 to 22 seconds after Play (median 12.5 seconds), while the 1.0.29 code never started Friends or Gilmore Girls and played a French release of Breaking Bad; the titles it did start opened in 4.5 to 8 seconds, because its player opened before checking that any video was arriving. Start times depend on the people sharing each source and varied from run to run. A title still cannot play when nobody is sharing it. Everything in 1.0.29 is included. Use source features only for content you may lawfully access."
          fi
