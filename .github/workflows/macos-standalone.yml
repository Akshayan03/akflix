name: Build standalone macOS update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-14
    # Akflix accounts: the project's public web config (repository variables,
    # not secrets; the values ship inside the app).
    env:
      VITE_AKFLIX_FIREBASE_API_KEY: ${{ vars.VITE_AKFLIX_FIREBASE_API_KEY }}
      VITE_AKFLIX_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_AKFLIX_FIREBASE_AUTH_DOMAIN }}
      VITE_AKFLIX_FIREBASE_PROJECT_ID: ${{ vars.VITE_AKFLIX_FIREBASE_PROJECT_ID }}
      VITE_AKFLIX_FIREBASE_APP_ID: ${{ vars.VITE_AKFLIX_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Reuse the verified standalone engines from v1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p src-tauri/binaries "$RUNNER_TEMP/akflix-old"
          gh release download v1.0.1 --pattern "Akflix_1.0.1_aarch64.dmg" --dir "$RUNNER_TEMP"
          hdiutil attach "$RUNNER_TEMP/Akflix_1.0.1_aarch64.dmg" \
            -nobrowse -readonly -mountpoint "$RUNNER_TEMP/akflix-old"
          cp "$RUNNER_TEMP/akflix-old/Akflix.app/Contents/MacOS/rqbit" \
            src-tauri/binaries/rqbit-aarch64-apple-darwin
          cp "$RUNNER_TEMP/akflix-old/Akflix.app/Contents/MacOS/ffmpeg" \
            src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          hdiutil detach "$RUNNER_TEMP/akflix-old"
          chmod +x src-tauri/binaries/*-aarch64-apple-darwin
          file src-tauri/binaries/*-aarch64-apple-darwin

      - name: Download the bundled captions model
        run: |
          mkdir -p src-tauri/models
          curl --fail --location --retry 3 \
            --output src-tauri/models/ggml-base.en-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en-q5_1.bin
          echo "4baf70dd0d7c4247ba2b81fafd9c01005ac77c2f9ef064e00dcf195d0e2fdd2f  src-tauri/models/ggml-base.en-q5_1.bin" \
            | shasum -a 256 --check

      - name: Validate frontend and Rust backend
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Build Apple Silicon app and DMG
        run: >-
          npx tauri build
          --config src-tauri/tauri.local.conf.json
          --target aarch64-apple-darwin
          --bundles app,dmg

      - name: Check the accounts config is built in
        run: |
          test -n "$VITE_AKFLIX_FIREBASE_PROJECT_ID" || { echo "Accounts config variables are not set"; exit 1; }
          grep -lF "$VITE_AKFLIX_FIREBASE_PROJECT_ID" dist/assets/*.js \
            || { echo "The frontend was built without the accounts config"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Akflix-${{ steps.version.outputs.version }}-macOS
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Akflix_${{ steps.version.outputs.version }}_aarch64.dmg
          if-no-files-found: error

      - name: Publish Mac-only update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          DMG="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Akflix_${VERSION}_aarch64.dmg"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG"
          else
            gh release create "$TAG" "$DMG" \
              --target "$GITHUB_SHA" \
              --title "Akflix $TAG" \
              --notes "Akflix 1.0.31 fixes a playback engine that could stop responding, after which every show and movie kept loading until Akflix was quit, and makes posters sharp on Retina screens. The torrent engine inside Akflix (rqbit) could lock up when Akflix chose the video file of a torrent that was already connected to people sharing it: two of its internal locks were taken in opposite orders, and from then on it accepted requests but never answered them. We reproduced this on a Mac: changing the selected episode of a well-shared season pack while it streamed locked the engine after about 300 changes. Akflix now changes the file selection only when it really changes, and most streams are added with the right file already selected; it also checks every 10 seconds that the engine still answers, and if it does not answer for about a minute, Akflix restarts the engine by itself. Posters, cards, the poster grid and episode images now load the size they are drawn at, so they are no longer blurry on Retina screens. Everything in 1.0.30 is included. Use source features only for content you may lawfully access."
          fi
