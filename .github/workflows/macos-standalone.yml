name: Build standalone macOS update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-14
    # Akflix accounts: the project's public web config (repository variables,
    # not secrets; the values ship inside the app).
    env:
      VITE_AKFLIX_FIREBASE_API_KEY: ${{ vars.VITE_AKFLIX_FIREBASE_API_KEY }}
      VITE_AKFLIX_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_AKFLIX_FIREBASE_AUTH_DOMAIN }}
      VITE_AKFLIX_FIREBASE_PROJECT_ID: ${{ vars.VITE_AKFLIX_FIREBASE_PROJECT_ID }}
      VITE_AKFLIX_FIREBASE_APP_ID: ${{ vars.VITE_AKFLIX_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            engine

      - run: npm ci

      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Reuse the verified standalone FFmpeg from v1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p src-tauri/binaries "$RUNNER_TEMP/akflix-old"
          gh release download v1.0.1 --pattern "Akflix_1.0.1_aarch64.dmg" --dir "$RUNNER_TEMP"
          hdiutil attach "$RUNNER_TEMP/Akflix_1.0.1_aarch64.dmg" \
            -nobrowse -readonly -mountpoint "$RUNNER_TEMP/akflix-old"
          cp "$RUNNER_TEMP/akflix-old/Akflix.app/Contents/MacOS/ffmpeg" \
            src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          hdiutil detach "$RUNNER_TEMP/akflix-old"
          chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin

      # rqbit 9.0.1 with Akflix's librqbit fixes (engine/README.md), built from this repository.
      - name: Build the torrent engine
        run: |
          sh engine/build.sh aarch64-apple-darwin
          file src-tauri/binaries/*-aarch64-apple-darwin

      - name: Download the bundled captions model
        run: |
          mkdir -p src-tauri/models
          curl --fail --location --retry 3 \
            --output src-tauri/models/ggml-base.en-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en-q5_1.bin
          echo "4baf70dd0d7c4247ba2b81fafd9c01005ac77c2f9ef064e00dcf195d0e2fdd2f  src-tauri/models/ggml-base.en-q5_1.bin" \
            | shasum -a 256 --check

      - name: Validate frontend and Rust backend
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Build Apple Silicon app and DMG
        run: >-
          npx tauri build
          --config src-tauri/tauri.local.conf.json
          --target aarch64-apple-darwin
          --bundles app,dmg

      - name: Check the accounts config is built in
        run: |
          test -n "$VITE_AKFLIX_FIREBASE_PROJECT_ID" || { echo "Accounts config variables are not set"; exit 1; }
          grep -lF "$VITE_AKFLIX_FIREBASE_PROJECT_ID" dist/assets/*.js \
            || { echo "The frontend was built without the accounts config"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Akflix-${{ steps.version.outputs.version }}-macOS
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Akflix_${{ steps.version.outputs.version }}_aarch64.dmg
          if-no-files-found: error

      - name: Publish Mac-only update
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          DMG="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Akflix_${VERSION}_aarch64.dmg"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG"
          else
            gh release create "$TAG" "$DMG" \
              --target "$GITHUB_SHA" \
              --title "Akflix $TAG" \
              --notes "Akflix 1.0.32 ships a torrent engine with its fixes built in. Akflix now builds its engine (rqbit) itself, from rqbit 9.0.1 with three changes. The lock-up that 1.0.31 worked around is fixed in the engine: changing the selected file of a torrent no longer takes two locks in opposite orders. A stream waiting for a source that never sends no longer holds one of the engine's eight disk slots: when all eight were held, every other title received one small block from each person sharing it and then nothing, and new titles could not start until Akflix was quit. We reproduced it: with eight such streams open, a title shared by hundreds of people could not even begin, and the same engine started it in under two seconds once they closed. And the part of a video the player is waiting for is now taken from a slow peer sooner, so big season packs start faster. The 1.0.31 check that restarts an engine which stops answering stays in. Everything in 1.0.31 is included. Use source features only for content you may lawfully access."
          fi
