name: Build standalone macOS update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Reuse the verified standalone engines from v1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p src-tauri/binaries "$RUNNER_TEMP/akflix-old"
          gh release download v1.0.1 --pattern "Akflix_1.0.1_aarch64.dmg" --dir "$RUNNER_TEMP"
          hdiutil attach "$RUNNER_TEMP/Akflix_1.0.1_aarch64.dmg" \
            -nobrowse -readonly -mountpoint "$RUNNER_TEMP/akflix-old"
          cp "$RUNNER_TEMP/akflix-old/Akflix.app/Contents/MacOS/rqbit" \
            src-tauri/binaries/rqbit-aarch64-apple-darwin
          cp "$RUNNER_TEMP/akflix-old/Akflix.app/Contents/MacOS/ffmpeg" \
            src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          hdiutil detach "$RUNNER_TEMP/akflix-old"
          chmod +x src-tauri/binaries/*-aarch64-apple-darwin
          file src-tauri/binaries/*-aarch64-apple-darwin

      - name: Download the bundled captions model
        run: |
          mkdir -p src-tauri/models
          curl --fail --location --retry 3 \
            --output src-tauri/models/ggml-base.en-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en-q5_1.bin
          echo "4baf70dd0d7c4247ba2b81fafd9c01005ac77c2f9ef064e00dcf195d0e2fdd2f  src-tauri/models/ggml-base.en-q5_1.bin" \
            | shasum -a 256 --check

      - name: Validate frontend and Rust backend
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Build Apple Silicon app and DMG
        run: >-
          npx tauri build
          --config src-tauri/tauri.local.conf.json
          --target aarch64-apple-darwin
          --bundles app,dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Akflix-${{ steps.version.outputs.version }}-macOS
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Akflix_${{ steps.version.outputs.version }}_aarch64.dmg
          if-no-files-found: error

      - name: Publish Mac-only update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          DMG="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Akflix_${VERSION}_aarch64.dmg"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG"
          else
            gh release create "$TAG" "$DMG" \
              --target "$GITHUB_SHA" \
              --title "Akflix $TAG" \
              --notes "Editorial desktop UI with ivory controls, charcoal surfaces, refined title typography and keyboard-visible artwork actions. This is a visual refinement, not a playback fix. Previously reported playback, episode handoff and storage issues remain under investigation. Use source features only for content you may lawfully access."
          fi
