# Deploys the /website folder to GitHub Pages, bundling the latest release
# installers into the site under /downloads/ so download links are served
# first-party from the site's own origin (no redirect to github.com).
#
# Runs on: pushes to main that touch website/, every published release
# (so new installers appear on the site automatically), and manual dispatch.

name: Deploy website

on:
  push:
    branches: [main]
    paths: ["website/**", "scripts/prepare-website-downloads.mjs", "tests/website-downloads.test.mjs", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:
  workflow_run:
    workflows: ["Build standalone Windows", "Build standalone macOS update"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test download inventory
        run: node --test tests/website-downloads.test.mjs

      - name: Bundle verified installers for each supported platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-website-downloads.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
